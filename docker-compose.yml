# Local infrastructure only. Backend and frontend run on the host.
#   docker compose up -d      start
#   docker compose down       stop (data is kept in the volume)
services:
  postgres:
    image: postgres:16-alpine
    container_name: sm-postgres
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart_dev_pw
      POSTGRES_DB: smart_messenger
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart_messenger"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sm-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
